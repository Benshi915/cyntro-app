version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: mentor_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API + web dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

volumes:
  qdrant_storage:
    driver: local

# ── Usage ──────────────────────────────────────────────────────────────────────
#
#   Start Qdrant:   docker compose -f docker/docker-compose.yml up -d
#   Stop Qdrant:    docker compose -f docker/docker-compose.yml down
#   Dashboard:      http://localhost:6333/dashboard
#
# Data is persisted in the named volume `qdrant_storage` so your knowledge
# base survives container restarts.
